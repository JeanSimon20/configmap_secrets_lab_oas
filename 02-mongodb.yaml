# ==============================================================================
# ARCHIVO: 02-mongodb.yaml
# DESCRIPCIÓN: PVC (Persistencia), Deployment y Service (ClusterIP) para MongoDB
# ==============================================================================

# 1. PersistentVolumeClaim: Solicita almacenamiento persistente a Minikube
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  labels:
    app: mongodb
spec:
  accessModes:
    - ReadWriteOnce          # El volumen puede ser montado como lectura/escritura por un solo nodo
  resources:
    requests:
      storage: 1Gi           # Capacidad solicitada para los datos de MongoDB
---
# 2. Deployment: Gestiona el Pod de la base de datos MongoDB
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: mongodb
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        tier: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
              name: mongo-port
          # Inyección de credenciales desde el Secret y ConfigMap para inicializar MongoDB
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
          # Montaje del volumen persistente en el directorio de datos oficial de Mongo
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
---
# 3. Service (ClusterIP): Expone MongoDB ÚNICAMENTE dentro del clúster
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  labels:
    app: mongodb
spec:
  type: ClusterIP            # Valor por defecto: aísla la BD del tráfico externo
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017            # Puerto del Service dentro del clúster
      targetPort: 27017      # Puerto del contenedor MongoDB

