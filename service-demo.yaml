# Servicio NodePort para exponer el Pod en Minikube (Paso 5B)
apiVersion: v1
kind: Service
metadata:
  name: backend-demo-svc
  namespace: demo-config
  labels:
    app: backend-demo
spec:
  type: NodePort
  selector:
    app: backend-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
