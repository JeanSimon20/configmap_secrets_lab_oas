# ==============================================================================
# ARCHIVO: service-demo.yaml
# DESCRIPCIÓN: Service de tipo NodePort para exponer el Pod hacia el navegador
#              en Minikube (Equivalente declarativo del Paso 5B).
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-demo-svc
  namespace: demo-config
  labels:
    app: backend-demo
spec:
  type: NodePort
  selector:
    app: backend-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080

